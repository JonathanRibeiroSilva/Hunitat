server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS. Naming it, and passing the upstream through a
    # variable below, defers name resolution to request time. With a literal
    # `proxy_pass http://api:3000` nginx resolves once at startup and refuses to
    # start at all if the api container is not yet registered — and, worse,
    # keeps proxying to a stale address after the api is recreated on a new IP,
    # which reads as the world being down until this container is restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Same-origin api ──────────────────────────────────────────────────────
    # Only reached when the image was built with empty VITE_API_URL/VITE_WS_URL,
    # which makes the client address its own origin instead of an absolute host.
    # That is what lets one published port be tunnelled and work from anywhere —
    # a baked-in localhost sends a remote guest's browser to their own machine.
    #
    # Harmless when the build did use absolute URLs: nothing requests these paths.

    # MUST precede `location /assets/`. nginx takes the longest matching prefix,
    # so this claims the world assets while hashed bundles stay on disk below.
    location /assets/world/ {
        set $api http://api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    location = /health {
        set $api http://api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    location /ws {
        set $api http://api:3000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The world ticks at 20 Hz but a parked avatar sends nothing. Without a
        # generous read timeout nginx closes an idle socket at 60 s and the
        # client reconnects on a backoff — presenting as other people vanishing
        # for a few seconds at a time.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed filenames, so these can be cached indefinitely. This is what makes
    # splitting the three/rapier chunks worth anything.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NOT be cached, or a deploy leaves clients pinned to the
    # old asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Single-page app: unknown paths fall through to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
